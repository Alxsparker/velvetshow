<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet Show — Redirection vers la page française</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://velvetshow.app/fr/">
  <meta http-equiv="refresh" content="0; url=https://velvetshow.app/fr/">
  <link rel="stylesheet" href="styles.css">
  <style>
    .redirect { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4rem 2rem; gap: 1rem; }
    .redirect p { color: var(--text-soft); font-family: var(--font-body); }
    .redirect a { color: var(--blue); }
  </style>
</head>
<body>
  <div class="redirect">
    <p>Cette page a déménagé vers <a href="https://velvetshow.app/fr/">velvetshow.app/fr</a>.</p>
  </div>
  <script>window.location.replace("https://velvetshow.app/fr/");</script>
</body>
</html>
